name: Yarn
on:
  pull_request:
    branches:
      - renovate/**
jobs:
  yarn_lock_changes:
    name: Lock File Changes
    runs-on: ubuntu-latest
    # Permission overwrite is required for Dependabot PRs
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Digest Lock File
        uses: Simek/yarn-lock-changes@4a12774bff8bf8addb72c22ea35e999c5fdf91d4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          collapsibleThreshold: 25
          failOnDowngrade: false
          path: yarn.lock
          updateComment: true
